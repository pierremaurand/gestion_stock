spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_stock
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
